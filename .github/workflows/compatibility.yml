name: Cross-platform template checks

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'scripts/build_templates.py'
      - 'scripts/reference_support.py'
      - 'scripts/reference_check.py'
      - 'scripts/compatibility_check.py'
      - 'scripts/manuscript_check.py'
      - 'requirements-dev.txt'
      - '.github/workflows/compatibility.yml'
  pull_request:
    paths:
      - 'templates/**'
      - 'scripts/build_templates.py'
      - 'scripts/reference_support.py'
      - 'scripts/reference_check.py'
      - 'scripts/compatibility_check.py'
      - 'scripts/manuscript_check.py'
      - 'requirements-dev.txt'
      - '.github/workflows/compatibility.yml'
  workflow_dispatch:

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  structural-compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install -r requirements-dev.txt
      - name: Generate templates on ${{ matrix.os }}
        run: |
          python scripts/build_templates.py
          python scripts/reference_support.py
      - name: Verify templates on ${{ matrix.os }}
        run: |
          python scripts/compatibility_check.py
          python scripts/manuscript_check.py
          python scripts/reference_check.py
