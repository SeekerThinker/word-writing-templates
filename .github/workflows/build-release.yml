name: Build templates and user downloads

on:
  push:
    branches: [main]
    paths-ignore:
      - 'templates/**'
      - 'release/**'
      - 'docs/开始使用-*.pdf'
      - 'docs/assets/previews/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies for previews
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-noto-cjk

      - name: Install build dependencies
        run: pip install -r requirements-dev.txt

      - name: Build Word templates
        run: python scripts/build_templates.py

      - name: Promote the single thinking-first public templates
        run: python scripts/thinking_support.py

      - name: Add caption, note and bibliography defaults
        run: python scripts/reference_support.py

      - name: Verify generated templates
        run: |
          python scripts/verify_templates.py
          python scripts/compatibility_check.py
          python scripts/thinking_check.py
          python scripts/manuscript_check.py
          python scripts/reference_check.py
          python scripts/stability_check.py

      - name: Render 12 public templates for layout smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/render-smoke
          while IFS= read -r -d '' f; do
            rel="${f#templates/}"
            out="build/render-smoke/$(dirname "$rel")"
            mkdir -p "$out"
            libreoffice --headless --convert-to pdf --outdir "$out" "$f" >/dev/null
          done < <(find templates/windows/books templates/windows/articles templates/macos/books templates/macos/articles -name '*.dotx' -print0)
          test "$(find build/render-smoke -name '*.pdf' | wc -l)" -eq 12

      - name: Build quick-start PDFs
        run: python scripts/make_quickstart.py

      - name: Build README preview images
        run: python scripts/make_previews.py

      - name: Package Windows and macOS downloads
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat version.txt)"
          rm -rf build release
          mkdir -p release
          for platform in windows macos; do
            if [ "$platform" = "windows" ]; then
              label="Windows"
              shortcut="Ctrl + Alt"
            else
              label="macOS"
              shortcut="Command + Option"
            fi
            folder="Word结构化写作模板-${label}-v${VERSION}"
            mkdir -p "build/${folder}/书籍模板" "build/${folder}/文章模板"
            cp templates/${platform}/books/*.dotx "build/${folder}/书籍模板/"
            cp templates/${platform}/articles/*.dotx "build/${folder}/文章模板/"
            cp "docs/开始使用-${platform}.pdf" "build/${folder}/00-开始使用.pdf"
            printf '%s\n' \
              "Word 结构化思考与写作模板集 - ${label}" \
              "" \
              "v4 开始，一个编号方案只保留一个用户模板。" \
              "模板已经准备好标题层级、导航窗格和可选成稿结构。你可以只用它整理思路、积累笔记；如果以后需要文章、报告或书稿，再沿着已经形成的结构继续展开。" \
              "" \
              "最重要的用法：" \
              "1. 大主题 / 大问题用“标题 1”。" \
              "2. 需要拆分时用“标题 2 / 标题 3 / 标题 4”。" \
              "3. 积累一些内容后打开 Word“导航窗格”，只看标题，检查并列、缺口、重复和顺序。" \
              "" \
              "整理和积累本身就是完整用途；不需要为了使用这些模板先决定最后是否成稿。" \
              "前言、摘要、作者信息、目录、参考文献等可选区块不会进入导航窗格；导航窗格主要呈现你的标题层级，也就是思考结构。" \
              "" \
              "书籍模板已经预置：书名页、作者、前言、自动目录、正文、附录、参考文献、正文页码、双面打印页边距、奇偶页页眉。" \
              "文章模板已经预置：作者、单位、日期、摘要、关键词、正文、参考文献和页码。" \
              "" \
              "图表与引用：Word 的“引用 → 插入题注 / 交叉引用”已经预置图表规则；脚注、尾注和参考文献样式也已准备好。" \
              "使用 Zotero / EndNote 时继续让引用管理器管理字段和格式，模板不会要求宏，也不会主动改写第三方引用字段。" \
              "" \
              "快捷键是可选的；本平台标题快捷键前缀是：${shortcut}" \
              "快捷键没反应时直接用 Word 的“样式”即可。" \
              "" \
              "不知道选哪种编号？" \
              "https://seekerthinker.github.io/word-writing-templates/" \
              "" \
              "更完整的一页说明见：00-开始使用.pdf" \
              > "build/${folder}/00-先看这里.txt"
            (cd build && zip -qr "../release/${folder}.zip" "$folder")
          done

      - name: Audit user download packages
        run: python scripts/release_audit.py

      - name: Upload release packages for QA
        uses: actions/upload-artifact@v4
        with:
          name: v4-release-packages
          path: release/*.zip
          retention-days: 7

      - name: Commit generated downloads and previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates release docs/开始使用-windows.pdf docs/开始使用-macos.pdf docs/assets/previews
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "build: refresh v4 templates, previews and downloads"
            git push
          fi

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat version.txt)"
          TAG="v${VERSION}"
          WIN="release/Word结构化写作模板-Windows-v${VERSION}.zip"
          MAC="release/Word结构化写作模板-macOS-v${VERSION}.zip"
          cp "$WIN" Word-Writing-Templates-Windows.zip
          cp "$MAC" Word-Writing-Templates-macOS.zip
          NOTES="v${VERSION}：6 种编号 × 2 个平台，共 12 个无宏 .dotx。标题 1–4 与 Word 导航窗格是核心思考工作流，可以用于整理思路、积累笔记和组织材料；如果以后需要文章、报告或书稿，也可以沿着同一套结构继续展开。每个模板同时包含可选成稿结构，前言、摘要、作者信息、目录、参考文献等可以暂时保留或删除，并使用非大纲样式避免干扰导航窗格。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Word-Writing-Templates-Windows.zip Word-Writing-Templates-macOS.zip --clobber
          else
            gh release create "$TAG" Word-Writing-Templates-Windows.zip Word-Writing-Templates-macOS.zip --target main --title "$TAG" --notes "$NOTES"
          fi
