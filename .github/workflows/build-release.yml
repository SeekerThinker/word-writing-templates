name: Build templates and user downloads

on:
  push:
    branches: [main]
    paths-ignore:
      - 'templates/**'
      - 'release/**'
      - 'docs/开始使用-*.pdf'
      - 'docs/assets/previews/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies for previews
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-noto-cjk

      - name: Install build dependencies
        run: pip install -r requirements-dev.txt

      - name: Build Word templates
        run: python scripts/build_templates.py

      - name: Add caption, note and bibliography defaults
        run: python scripts/reference_support.py

      - name: Verify generated templates
        run: |
          python scripts/verify_templates.py
          python scripts/compatibility_check.py
          python scripts/manuscript_check.py
          python scripts/reference_check.py
          python scripts/stability_check.py

      - name: Render all templates for layout smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/render-smoke
          while IFS= read -r -d '' f; do
            rel="${f#templates/}"
            out="build/render-smoke/$(dirname "$rel")"
            mkdir -p "$out"
            libreoffice --headless --convert-to pdf --outdir "$out" "$f" >/dev/null
          done < <(find templates -name '*.dotx' -print0)
          test "$(find build/render-smoke -name '*.pdf' | wc -l)" -eq 24

      - name: Build quick-start PDFs
        run: python scripts/make_quickstart.py

      - name: Build README preview images
        run: python scripts/make_previews.py

      - name: Package Windows and macOS downloads
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat version.txt)"
          rm -rf build release
          mkdir -p release
          for platform in windows macos; do
            if [ "$platform" = "windows" ]; then
              label="Windows"
              shortcut="Ctrl + Alt"
            else
              label="macOS"
              shortcut="Command + Option"
            fi
            folder="Word结构化写作模板-${label}-v${VERSION}"
            mkdir -p \
              "build/${folder}/书籍模板/带常用结构" \
              "build/${folder}/文章模板/带常用结构"
            cp templates/${platform}/books/*.dotx "build/${folder}/书籍模板/"
            cp templates/${platform}/articles/*.dotx "build/${folder}/文章模板/"
            cp templates/${platform}/structured/books/*.dotx "build/${folder}/书籍模板/带常用结构/"
            cp templates/${platform}/structured/articles/*.dotx "build/${folder}/文章模板/带常用结构/"
            cp "docs/开始使用-${platform}.pdf" "build/${folder}/00-开始使用.pdf"
            printf '%s\n' \
              "Word 结构化思考与写作模板集 - ${label}" \
              "" \
              "这套模板最重要的目的不是把 Word 排得更漂亮，而是用结构化写作辅助思考。" \
              "用标题 1 / 2 / 3 / 4 给想法分层；文档变长后打开 Word 的导航窗格，就能持续看到全文结构，并可拖动标题整体调整章节顺序。" \
              "模板不会替你思考，但会让思考的结构更容易被看见、检查和调整。" \
              "" \
              "最简单的用法只有 3 步：" \
              "1. 进入“书籍模板”或“文章模板”。" \
              "2. 直接双击文件夹第一层的 .dotx 文件。" \
              "3. Word 会新建文档，把“在这里输入……”和“从这里开始写作”换成自己的内容。" \
              "" \
              "写作时可以记住这个循环：想到 → 写下 → 归类 → 命名 → 看整体结构 → 调整顺序 → 继续写。" \
              "排版自动化只是为了尽量不让编号、目录、页码等技术细节打断你的思考。" \
              "" \
              "如果你希望文档一开始就更接近成稿：" \
              "- 书籍：进入“书籍模板/带常用结构”。除书名页、前言、目录、页码和参考文献外，还会让每个一级章标题自动另起新页，并预置镜像页边距、装订线、奇偶页页眉和外侧页码。" \
              "- 文章：进入“文章模板/带常用结构”，会预置作者/单位/日期、摘要、关键词、页码和参考文献，并优化首页信息间距。" \
              "- 这些区块都是可选的，不需要时直接删除即可。" \
              "" \
              "图表与交叉引用：" \
              "- Word 的“引用 → 插入题注”已经预置“图 / 表”标签。书籍按一级章编号，文章连续编号。" \
              "- 文中引用图表时，用“引用 → 交叉引用”，不要手打编号；增删图表后更新域即可。" \
              "" \
              "脚注与参考文献：" \
              "- 插入脚注可以用 ${shortcut} + F；模板已统一脚注 / 尾注的字体与字号。" \
              "- 手工参考文献可选“参考文献条目”样式，自动使用悬挂缩进。" \
              "- 使用 Zotero / EndNote 时让引用管理器继续管理字段和格式，模板不会要求宏，也不会主动改写引用字段。" \
              "" \
              "第一次打开模板时，只需要记住：" \
              "- 需要新章节：可以在 Word 的“样式”区域选择“标题 1 / 标题 2 / 标题 3 / 标题 4”。" \
              "- 也可以用快捷键；本平台快捷键前缀是：${shortcut}" \
              "- 快捷键没反应也没关系，直接用“样式”即可，标题编号仍会正常工作。" \
              "" \
              "不知道该选哪个模板？" \
              "https://seekerthinker.github.io/toolbox/word-writing-templates/" \
              "" \
              "更完整的一页说明见：00-开始使用.pdf" \
              > "build/${folder}/00-先看这里.txt"
            (cd build && zip -qr "../release/${folder}.zip" "$folder")
          done

      - name: Audit user download packages
        run: python scripts/release_audit.py

      - name: Commit generated downloads and previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates release docs/开始使用-windows.pdf docs/开始使用-macos.pdf docs/assets/previews
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "build: refresh templates, previews and downloads"
            git push
          fi

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat version.txt)"
          TAG="v${VERSION}"
          WIN="release/Word结构化写作模板-Windows-v${VERSION}.zip"
          MAC="release/Word结构化写作模板-macOS-v${VERSION}.zip"
          cp "$WIN" Word-Writing-Templates-Windows.zip
          cp "$MAC" Word-Writing-Templates-macOS.zip
          NOTES="v3.1 结构化思考定位升级：这套模板首先帮助用户用标题层级组织思路，并通过 Word 导航窗格持续查看和调整全文结构；自动编号、目录、页码、题注、脚注和参考文献用于减少格式维护对思考与写作的打断。模板仍保持 6 种编号 × 2 种起步方式 × 2 个平台，共 24 个无宏 .dotx；文件名、编号体系和 Windows / macOS 的 releases/latest 稳定下载地址不变。已经用 v3.0 创建的 .docx 文稿无需重新套模板。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Word-Writing-Templates-Windows.zip Word-Writing-Templates-macOS.zip --clobber
          else
            gh release create "$TAG" Word-Writing-Templates-Windows.zip Word-Writing-Templates-macOS.zip --target main --title "$TAG" --notes "$NOTES"
          fi