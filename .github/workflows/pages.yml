name: Deploy ordinary-user homepage

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'templates/**'
      - 'scripts/web_editor_export_check.py'
      - 'scripts/editor_copy_check.cjs'
      - 'scripts/documentation_contract_check.py'
      - 'docs/assets/previews/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: word-writing-homepage
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Word export validation dependencies
        run: python -m pip install 'lxml>=5.0' 'python-docx>=1.1'

      - name: Check editor JavaScript syntax and view-copy observer
        run: |
          node --check site/editor.js
          node --check site/editor-copy.js
          node --check site/i18n.js
          node --check site/app.js
          node --check site/en/app.js
          node scripts/editor_copy_check.cjs

      - name: Check project documentation contract
        run: python scripts/documentation_contract_check.py

      - name: Validate Word export packages
        run: python scripts/web_editor_export_check.py

      - name: Validate public homepage
        shell: python
        run: |
          from pathlib import Path

          app = Path('site/app.js').read_text(encoding='utf-8')
          page = Path('site/index.html').read_text(encoding='utf-8')
          guide = Path('site/guide.html').read_text(encoding='utf-8')
          editor = Path('site/editor.html').read_text(encoding='utf-8')
          editor_js = Path('site/editor.js').read_text(encoding='utf-8')
          en_app = Path('site/en/app.js').read_text(encoding='utf-8')
          en_page = Path('site/en/index.html').read_text(encoding='utf-8')
          en_guide = Path('site/en/guide.html').read_text(encoding='utf-8')
          en_editor = Path('site/en/editor.html').read_text(encoding='utf-8')
          i18n = Path('site/i18n.js').read_text(encoding='utf-8')

          required = [
              '书籍-中文传统.dotx', '书籍-章节数字.dotx', '书籍-纯数字.dotx',
              '文章-中文论文.dotx', '文章-数字层级.dotx', '文章-中文简洁.dotx',
              'Word-Writing-Templates-Windows.zip', 'Word-Writing-Templates-macOS.zip',
          ]
          for item in required:
              if item not in app or item not in en_app:
                  raise SystemExit(f'missing bilingual public download mapping: {item}')

          for phrase in ['标题层级', '导航窗格', '选一个适合你的模板', '积累笔记']:
              if phrase not in page:
                  raise SystemExit(f'missing Chinese homepage concept: {phrase}')
          for phrase in ['打开导航窗格', '标题 1', '拖动标题', '自动目录']:
              if phrase not in guide:
                  raise SystemExit(f'missing Chinese usage-guide concept: {phrase}')
          for phrase in ['在线结构化写作', '导出 Word', '拖动标题可以移动整节', '文档语言']:
              if phrase not in editor:
                  raise SystemExit(f'missing Chinese editor concept: {phrase}')

          for phrase in ['Turn Word into', 'Navigation Pane', 'Find a template', 'Start in 3 minutes']:
              if phrase not in en_page:
                  raise SystemExit(f'missing English homepage concept: {phrase}')
          for phrase in ['Open the Navigation Pane', 'Heading 1', 'drag a heading', 'table of contents']:
              if phrase not in en_guide:
                  raise SystemExit(f'missing English usage-guide concept: {phrase}')
          for phrase in ['Online structured editor', 'Export Word', 'Document language', 'Drag a heading']:
              if phrase not in en_editor:
                  raise SystemExit(f'missing English editor concept: {phrase}')

          for phrase in ['indexedDB', 'Heading${node.level}', 'word/document.xml', 'word/styles.xml', 'word/numbering.xml', '[Content_Types].xml', 'JSZip.loadAsync']:
              if phrase not in editor_js:
                  raise SystemExit(f'missing structured Word export behavior: {phrase}')

          integrity = 'sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg=='
          for editor_page in (editor, en_editor):
              for phrase in ['jszip/3.10.1/jszip.min.js', integrity, 'referrerpolicy="no-referrer"']:
                  if phrase not in editor_page:
                      raise SystemExit(f'missing pinned JSZip contract: {phrase}')

          if 'name: "Traditional Chinese"' in en_app:
              raise SystemExit('English UI must not call a numbering preset “Traditional Chinese”')
          for phrase in ['Chinese traditional chapter numbering', 'Chinese academic numbering', 'Compact Chinese numbering']:
              if phrase not in en_app or phrase not in editor_js:
                  raise SystemExit(f'missing clarified English numbering name: {phrase}')

          for phrase in ['navigator.languages', 'localStorage', 'language-switch', 'window.location.replace', 'editor.html']:
              if phrase not in i18n:
                  raise SystemExit(f'missing language behavior: {phrase}')

          forbidden_positioning = ['也把文章写完', '从想法一直长成最终文稿']
          for phrase in forbidden_positioning:
              if phrase in page or phrase in guide:
                  raise SystemExit(f'public site regressed to mandatory-manuscript positioning: {phrase}')
          if 'word_quick_success' in page or 'word_compatibility_report' in page:
              raise SystemExit('homepage must not solicit compatibility feedback')

          print('Bilingual homepage, guide, and online editor contract OK')

      - name: Assemble static site
        shell: python
        run: |
          from pathlib import Path
          import shutil

          site = Path('site')
          out = Path('_site')
          if out.exists():
              shutil.rmtree(out)
          shutil.copytree(site, out)

          previews = out / 'previews'
          previews.mkdir(parents=True, exist_ok=True)
          for source in Path('docs/assets/previews').glob('*.png'):
              shutil.copy2(source, previews / source.name)

          # Export uses the real .dotx packages as browser-side skeletons.
          # Keep them on the same Pages origin so drafts never need to be sent
          # to an application server just to create a .docx file.
          shutil.copytree(Path('templates'), out / 'templates')

          # The Chinese source pages stay simple in the repository; the deployed
          # copies receive the shared language detector/switcher and hreflang links.
          zh_index = out / 'index.html'
          text = zh_index.read_text(encoding='utf-8')
          text = text.replace(
              '<link rel="stylesheet" href="./styles.css" />',
              '<link rel="alternate" hreflang="zh-CN" href="./" />\n'
              '  <link rel="alternate" hreflang="en" href="./en/" />\n'
              '  <link rel="stylesheet" href="./styles.css" />'
          )
          text = text.replace(
              '<script src="./app.js"></script>',
              '<script src="./i18n.js"></script>\n  <script src="./app.js"></script>'
          )
          zh_index.write_text(text, encoding='utf-8')

          zh_guide = out / 'guide.html'
          text = zh_guide.read_text(encoding='utf-8')
          text = text.replace(
              '<link rel="stylesheet" href="./styles.css" />',
              '<link rel="alternate" hreflang="zh-CN" href="./guide.html" />\n'
              '  <link rel="alternate" hreflang="en" href="./en/guide.html" />\n'
              '  <link rel="stylesheet" href="./styles.css" />'
          )
          text = text.replace('</body>', '  <script src="./i18n.js"></script>\n</body>')
          zh_guide.write_text(text, encoding='utf-8')

          (out / '.nojekyll').touch()

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
