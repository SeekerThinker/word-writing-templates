name: Deploy ordinary-user homepage

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/assets/previews/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: word-writing-homepage
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate public homepage
        shell: python
        run: |
          from pathlib import Path
          app = Path('site/app.js').read_text(encoding='utf-8')
          page = Path('site/index.html').read_text(encoding='utf-8')
          required = [
              '书籍-中文传统.dotx', '书籍-章节数字.dotx', '书籍-纯数字.dotx',
              '文章-中文论文.dotx', '文章-数字层级.dotx', '文章-中文简洁.dotx',
              'Word-Writing-Templates-Windows.zip', 'Word-Writing-Templates-macOS.zip',
          ]
          for item in required:
              if item not in app:
                  raise SystemExit(f'missing public download mapping: {item}')
          for phrase in ['用 Word 整理思路', '导航窗格', '选一个适合你的模板']:
              if phrase not in page:
                  raise SystemExit(f'missing ordinary-user homepage copy: {phrase}')
          if 'word_quick_success' in page or 'word_compatibility_report' in page:
              raise SystemExit('homepage must not solicit compatibility feedback')
          print('Homepage contract OK')

      - name: Assemble static site
        run: |
          mkdir -p _site/previews
          cp site/index.html site/styles.css site/app.js _site/
          cp docs/assets/previews/*.png _site/previews/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
